<!DOCTYPE html>
{# 서버 오류 페이지: 오류 상황이라 DB·로그인 정보에 기대지 않도록 base.html 을 쓰지 않는다 #}
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - 일시적인 오류</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #eee;
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      .logo { font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; }
      .logo span { color: #fe4a51; }
      p { color: #aaa; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1.4rem;
        border-radius: 0.4rem;
        background: #fe4a51;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Th<span>Read</span></div>
      <h1>일시적인 오류가 발생했어요</h1>
      <p>잠시 후 다시 시도해 주세요.<br />문제가 계속되면 관리자에게 알려 주세요.</p>
      <a href="/">메인으로</a>
    </main>
  </body>
</html>
